<section id="form">
    <h2>Cadastro de Atleta</h2>

    <form id="form-atleta" (submit)="enviarDadosAtleta()">
        <label for="nome">Nome Completo</label>
        <input type="text" name="nome" id="nome" [(ngModel)]="nome" class="input01" maxlength="60" required placeholder="Digite o nome completo">

        <label for="cpf">CPF</label>
        <input type="text" name="cpf" [(ngModel)]="cpf"  id="cpf" class="input02" maxlength="14" required placeholder="Digite o CPF">

        <label for="sexo">Sexo</label>
        <input type="radio" name="sexo" id="sexoM" [(ngModel)]="sexo" class="radio01" required value="M">Masculino
        <input type="radio" name="sexo" id="sexoF" [(ngModel)]="sexo" class="radio02" required value="F">Feminino
        <input type="radio" name="sexo" id="sexoN" [(ngModel)]="sexo" class="radio03" required value="N">Não Declarar

        <label for="cep">CEP</label>
        <input type="text" name="cep" id="cep" [(ngModel)]="cep" class="input02" maxlength="9" required placeholder="Digite o CEP">

        <label for="rua-logradouro">Rua/Logradouro</label>
        <input type="text" name="rua-logradouro" id="rua-logradouro" [(ngModel)]="ruaLogradouro" class="input2" maxlength="100" required placeholder="Digite a Rua ou o Logradouro">

        <label for="bairro">Bairro</label>
        <input type="text" name="bairro" id="bairro" [(ngModel)]="bairro" class="input2" maxlength="60" required placeholder="Digite o bairro">

        <label for="cidade">Cidade</label>
        <input type="text" name="cidade" id="cidade" [(ngModel)]="cidade" class="input2" maxlength="60" required placeholder="Digite a cidade">

        <label for="uf">UF</label>
        <input type="text" name="uf" id="uf" [(ngModel)]="uf" class="input2" maxlength="10" required placeholder="Digite a UF">

        <div id="div-btns">
            <button type="submit" id="btnAdd"> Cadastrar </button>
            <button type="reset" id="btnLimpar"> Limpar </button>
        </div>
    </form>

</section>
