<section id="form">
    <h2>Cadastro de Corridas</h2>

    <form id="form-corrida">
        <label for="descricao">Descrição de Corrida</label>
        <input type="text" name="descricao" id="descricao" class="input01" required placeholder="Ex: 5ª Maratona Noturna da Cidade">

        <label for="data">Data da Corrida</label>
        <input type="date" name="data" id="data" class="input02" required>

        <label>Distâncias Disponíveis</label>

        <div class="distancias">
            <label>
                <input type="radio" name="distancia" id="distancia" required value="5">
                5km
            </label>

            <label>
                <input type="radio" name="distancia" id="distancia" required value="10">
                10km
            </label>

            <label>
                <input type="radio" name="distancia" id="distancia" required value="25">
                25km
            </label>
        </div>

        <div id="div-btns">
            <button type="submit">Cadastrar Corrida</button>
        </div>
        
    </form>
</section>
