<section id="form-inscricao">

    <h2>Inscrição na Corrida</h2>

    <form id="form-inscricao-corrida" #formInscricao="ngForm" (ngSubmit)="finalizarInscricao()">

       

        <div class="linha">
            <div class="campo campo-atleta">
                <label for="atleta">Atleta Cadastrado</label>

                <select
                    id="atleta"
                    name="atleta"
                    [(ngModel)]="atletaSelecionado"
                    (change)="selecionarAtleta()"
                    required
                >

                    <option [ngValue]="0">
                        Selecione o atleta
                    </option>

                    @for (atleta of listaAtletas; track atleta.id) {

                        <option [ngValue]="atleta.id">
                            {{ atleta.nome }}
                        </option>

                    }

                </select>

            </div>


            

            <div class="campo campo-cpf">

                <label for="cpf">
                    Ou Buscar por CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    [(ngModel)]="cpf"
                    placeholder="000.000.000-00"
                    (blur)="buscarPorCpf()"
                >

            </div>

        </div>

        <div class="linha">

            <div class="campo campo-corrida">

                <label for="corrida">
                    Corrida Escolhida
                </label>

                <select
                    id="corrida"
                    name="corrida"
                    [(ngModel)]="corridaSelecionada"
                    (change)="selecionarCorrida()"
                    required
                >

                    <option [ngValue]="0">
                        Selecione uma corrida
                    </option>

                    @for (corrida of listaCorridas; track corrida.id) {

                        <option [ngValue]="corrida.id">

                            {{ corrida.descricao }}

                            ({{ corrida.data | date:'dd/MM/yyyy' }})

                        </option>

                    }

                </select>

            </div>

            <div class="campo campo-distancia">

                <label>
                    Distância da Prova
                </label>
                
                <div class="distancias">
                
                    @for (distanciaDisponivel of distancias; track distanciaDisponivel) {
                
                        <label>
                
                            <input
                                type="radio"
                                name="distancia"
                                [value]="distanciaDisponivel"
                                [(ngModel)]="distancia"
                                required
                            >
                
                            {{ distanciaDisponivel }}km
                
                        </label>
                
                    } @empty {
                
                        <span>
                            Selecione uma corrida
                        </span>
                
                    }

                </div>

            </div>

        </div>

        <div class="linha">

            <div class="campo campo-camiseta">

                <label for="camiseta">
                    Tamanho da Camiseta (Kit)
                </label>

                <select
                    id="camiseta"
                    name="camiseta"
                    [(ngModel)]="tamanhoCamiseta"
                    required
                >

                    <option value="">
                        Selecione
                    </option>

                    <option value="PP">PP</option>

                    <option value="P">P</option>

                    <option value="M">M</option>

                    <option value="G">G</option>

                    <option value="GG">GG</option>

                    <option value="XG">XG</option>

                </select>

            </div>

            <div class="campo campo-categoria">

                <label for="categoria">
                    Categoria / Faixa Etária
                </label>

                <input
                    type="text"
                    id="categoria"
                    name="categoria"
                    [(ngModel)]="categoria"
                    readonly
                    placeholder="Selecione o atleta"
                >

            </div>

        </div>

        <div id="valor-inscricao">

            <strong>
                Valor da Inscrição:
            </strong>

            <span>
                R$ {{ valorInscricao.toFixed(2).replace('.', ',') }}
            </span>

        </div>

        <div id="termos">

            <label>

            <input type="checkbox"name="termos" [(ngModel)]="termosAceitos" required>Li e aceito os termos do regulamento da prova e declaração de saúde.</label>
        </div>

        <button type="submit" [disabled]="formInscricao.invalid"> Finalizar e Ir para Pagamento</button>
    </form>
</section>
