<section id="form">
    <h2>Cadastro de Corridas</h2>

    <form id="form-corrida" #formCorrida="ngForm" (ngSubmit)="cadastrar()">

        <label for="descricao">Descrição da Corrida</label>
        <input
            type="text"
            name="descricao"
            id="descricao"
            class="input01"
            required
            placeholder="Ex: 5ª Maratona Noturna da Cidade"
            [(ngModel)]="descricao"
        >

        <label for="data">Data da Corrida</label>
        <input
            type="date"
            name="data"
            id="data"
            class="input02"
            required
            [(ngModel)]="data"
        >

        <label for="local">Local da Corrida</label>
        <input
            type="text"
            name="local"
            id="local"
            class="input01"
            required
            placeholder="Ex: Aracaju - SE"
            [(ngModel)]="local"
        >

        <label>Distâncias Disponíveis</label>

        <div class="distancias">

            <label>
                <input
                    type="checkbox"
                    name="distancia5"
                    [checked]="distancias.includes(5)"
                    (change)="selecionarDistancia(5, $event)"
                >
                5km
            </label>

            <label>
                <input
                    type="checkbox"
                    name="distancia10"
                    [checked]="distancias.includes(10)"
                    (change)="selecionarDistancia(10, $event)"
                >
                10km
            </label>

            <label>
                <input
                    type="checkbox"
                    name="distancia25"
                    [checked]="distancias.includes(25)"
                    (change)="selecionarDistancia(25, $event)"
                >
                25km
            </label>

        </div>

        <div id="div-btns">
            <button type="submit" [disabled]="formCorrida.invalid">{{ !editar ? 'Cadastrar Corrida' : 'Alterar Corrida' }}</button>
        </div>

    </form>
</section>
